<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background remover API</title>
</head>
<body>
    <h2>Background Remover App.</h2>
    <input type="file" id="fileInput" accept="image/*"> <!--Accept ANY type of image format-->
    <button id="sendBtn" onclick="removeBG()">Remove Background</button>
    <div id="status"></div>
    <h3>Result</h3>
    <img id="resultImg" alt="result image">
    <br><br>
    <button id="downloadBtn" onclick="downloadImage()" style="display:none;">Download Image</button>
    <script>
        const API_KEY = "paste api key here"; // Replace with your key
        let imageURL = ""; // make it global so downloadImage() can access it
        async function  removeBG(){
        const fileInput=document.getElementById("fileInput");
        const file = fileInput.files[0];
               /*
               ->files is a built-in property of <input type="file">
               ->It contains a FileList (like an array)
               ->It stores all selected files
                Example:
                    If user selects 1 image →
                    fileInput.files = [File]
 
                    If user selects 3 images →
                    fileInput.files = [File, File, File]
                */
                if(!file){
                    alert("Please choose file");
                    return;
                }
                const formData = new FormData();
                // Create a FormData object to send the image file to the API.
                // FormData allows us to upload files (images) because JSON cannot hold file data.
                formData.append("image_file",file);
                // Attach the actual image file to the request.
                // "image_file" is the key that remove.bg API expects.
                // fileInput is the selected file object (image chosen by the user).
                formData.append("size","auto");
                // Tell the API to automatically detect the best output size for the removed background image.
                // "auto" → remove.bg chooses the highest possible quality.
                const response = await fetch("https://api.remove.bg/v1.0/removebg",{
                    //fetch() is used to call an API.
                    //"https://api.remove.bg/v1.0/removebg" is the Remove.bg API URL where we send the image.
                    //await means JavaScript stops here until the API replies.
                    //The API's reply is stored inside response.
                    method:"POST",
                    //We are sending data (the image) to the server.So we use "POST" method.
                    headers:{
                        "X-Api-Key":API_KEY
                        //Remove.bg expects for authentication. so we need to give api key
                    },
                    body:formData
                    //formData contains: the uploaded image (image_file) & the size option (auto)
                });
                const resultBlob=await response.blob();
                //Convert the binary image data from Remove.bg into a JavaScript file object (Blob = Binary Large Object, It is used to store images, videos, files in JavaScript.)
                imageURL=URL.createObjectURL(resultBlob);
                //Converts a Blob or File into a temporary URL that the browser can use.
                //This URL points to the binary image in memory, so you can display or download it.
                document.getElementById("resultImg").src=imageURL;
                //The src attribute of an <img> tag specifies which image file to display. By setting .src = imageUrl, the browser knows what image to show.
                // Function to download the image
                document.getElementById("downloadBtn").style.display = "inline-block";
                }
                function downloadImage() {
                    if (!imageURL) {
                        alert("No image to download!");
                        return;
                    }
                    const a = document.createElement("a"); // create temporary <a> tag
                    a.href = imageURL;                     // set href to blob URL
                    a.download = "no-background.png";      // set default file name
                    document.body.appendChild(a);          // append to DOM
                    a.click();                             // trigger download
                    document.body.removeChild(a);          // remove from DOM
                }
    </script>
</body>
</html>
