<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer (OpenRouter API)</title>
</head>
<body>

    <h2>Text Summarizer using OpenRouter + Mistral</h2>

    <!-- Input box where user types text -->
    <textarea id="inputText" rows="5" cols="50" placeholder="Enter text to summarize..."></textarea>
    <br><br>

    <!-- Button that runs the summarize() function -->
    <button onclick="summarize()">Summarize</button>

    <h3>Summary:</h3>

    <!-- This div will show the final summary -->
    <div id="output" style="white-space:pre-wrap"></div>

<script>

    // ❗ IMPORTANT: NEVER PUT YOUR REAL API KEY IN FRONTEND CODE
    // Anyone can view your source code and steal the key.
    // Safest: keep API key in backend only.
    const API_KEY = "YOUR_API_KEY_HERE";

    // This is the fixed API endpoint for OpenRouter
    const API_URL = "https://openrouter.ai/api/v1/chat/completions";

    /*
        summarize()
        Runs when user clicks the button.

        What it does:
        1. Reads text from the textarea
        2. Sends text to OpenRouter API for summarizing
        3. Receives summary response
        4. Shows the summary on the page
    */
    async function summarize() {

        // Get the user's input text from the textbox
        const text = document.getElementById("inputText").value;

        // Send request to OpenRouter API
        const response = await fetch(API_URL, {
            method: "POST",

            // Headers tell API what we are sending and who we are
            headers: {
                "Content-Type": "application/json",          // We send JSON data
                "Authorization": `Bearer ${API_KEY}`,        // Bearer = sending our API key securely

                // Required by OpenRouter for identification
                "HTTP-Referer": "https://yourapp.com",
                "X-Title": "Text Summarizer App"
            },

            // Body = actual data we send to the AI model
            body: JSON.stringify({
                model: "mistralai/mistral-7b-instruct:free",  // AI model to use

                // Messages work same as ChatGPT conversation
                messages: [
                    {
                        role: "user",
                        content: "Summarize this: " + text   // What we want the AI to summarize
                    }
                ]
            })
        });

        // Convert API response (JSON text → JS object)
        const data = await response.json();

        //  Print full response in console (for debugging)
        console.log("Full API Response:", data);

        /*
             Extract summary safely:

            data?.choices?.[0]?.message?.content

            - "?.": optional chaining → avoids errors if something is missing
            - If any value is missing, the whole expression becomes undefined
            - "||" → fallback value so app never crashes
        */
        const summary =
            data?.choices?.[0]?.message?.content ||
            "Error: No summary generated.";

        //  Show final summary on the page
        document.getElementById("output").innerText = summary;
    }
</script>

</body>
</html>
